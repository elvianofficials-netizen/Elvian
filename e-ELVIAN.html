<style>
:root{--bg:#05050c;--pn:rgba(12,10,26,.74);--ink:#f5f3ff;--mu:rgba(224,224,241,.62);--ln:rgba(217,180,90,.22);--gd:#d9b45a;--vi:#a66bff;--ub:linear-gradient(135deg,#6a3fb5,#4a2a86);--ut:#fff;--ab:rgba(20,16,38,.78);--ov:5,5,12;--e:cubic-bezier(.22,1,.36,1)}
[data-theme=light]{--bg:#f6f3ea;--pn:rgba(255,255,255,.93);--ink:#15121c;--mu:rgba(30,25,45,.78);--ln:rgba(110,80,15,.38);--gd:#7a5a0e;--vi:#5a2fb0;--ub:linear-gradient(135deg,#f3dc9b,#e0b955);--ut:#1a1305;--ab:rgba(255,255,255,.95);--ov:246,243,234}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
textarea,input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1.15em;height:1.15em;display:block}
#bg,#dim{position:fixed;inset:0;background-size:cover;background-position:center;transition:background-image 1s}
#dim{background:rgba(var(--ov),var(--d,.55))}
.app{position:fixed;inset:0;display:flex;height:100dvh}
aside{width:224px;flex:none;display:flex;flex-direction:column;gap:.35rem;padding:calc(.7rem + env(safe-area-inset-top)) .55rem calc(.6rem + env(safe-area-inset-bottom));transition:margin-left .5s var(--e),transform .5s var(--e);background:var(--pn);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--ln);z-index:6;transition:transform .5s var(--e)}
.brand{font:300 1rem 'Space Grotesk',sans-serif;letter-spacing:.38em;color:var(--gd);text-decoration:none;padding:.2rem .5rem}
.nav{display:flex;gap:.5rem;align-items:center;padding:.42rem .6rem;font-size:.8rem;border:1px solid var(--ln);border-radius:10px;transition:background .3s}
.nav:hover,.chat:hover{background:rgba(217,180,90,.12)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chat{display:flex;align-items:center;border-radius:10px;position:relative}
.chat.on{background:rgba(166,107,255,.2)}
.chat .t{flex:1;text-align:left;padding:.4rem .6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
.dots{opacity:0;padding:.45rem;border-radius:8px;transition:opacity .2s}
.chat:hover .dots,.chat.on .dots,.dots:focus-visible{opacity:1}
@media(hover:none){.dots{opacity:1}}
.pop{position:fixed;z-index:30;min-width:150px;padding:.3rem;border:1px solid var(--ln);border-radius:12px;background:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pop button{display:flex;gap:.6rem;align-items:center;width:100%;padding:.6rem .8rem;border-radius:8px;text-align:left}
.pop button:hover{background:rgba(217,180,90,.14)}.pop .dg{color:#ff7b8a}
.foot{display:flex;flex-direction:column;gap:.3rem;border-top:1px solid var(--ln);padding-top:.6rem}
.foot small,.hint{color:var(--mu);font-size:.68rem;letter-spacing:.08em;text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:.6rem;padding:calc(.6rem + env(safe-area-inset-top)) 1rem .6rem;background:var(--pn);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
header h2{margin:0;font:400 .95rem 'Space Grotesk',sans-serif;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none;padding:.4rem}
#msgs{flex:1;overflow:auto;padding:1.2rem clamp(.8rem,4vw,2rem);scroll-behavior:smooth}
.in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}
.m{display:flex;gap:.7rem;animation:up .5s var(--e)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.m.user{flex-direction:row-reverse}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:500 .8rem 'Space Grotesk';border:1px solid var(--gd);color:var(--gd);background:var(--ab)}
.m.user .av{display:none}
.col{min-width:0;max-width:min(88%,680px)}
.body{padding:.7rem 1rem;border-radius:16px;background:var(--ab);border:1px solid var(--ln);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);word-wrap:break-word;overflow-wrap:anywhere}
.m.user .body{background:var(--ub);color:var(--ut);border-color:transparent;white-space:pre-wrap}
.body p{margin:.35rem 0}.body h2,.body h3,.body h4{margin:.7rem 0 .3rem;font-weight:500}.body ul,.body ol{margin:.3rem 0;padding-left:1.3rem}.body a{color:var(--vi)}
.body blockquote{margin:.4rem 0;padding-left:.8rem;border-left:3px solid var(--gd);color:var(--mu)}
.body code{font:.86em ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.2);padding:.1em .35em;border-radius:5px}
pre{margin:.5rem 0;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#161224;color:#f5f3ff}
pre code{display:block;padding:.8rem;overflow:auto;background:none;white-space:pre;-webkit-user-select:text;user-select:text}
.ph{display:flex;justify-content:space-between;padding:.35rem .8rem;font-size:.72rem;background:rgba(217,180,90,.18);color:#e8c872}
table{border-collapse:collapse;margin:.5rem 0;display:block;overflow:auto}td,th{border:1px solid var(--ln);padding:.35rem .7rem}th{background:rgba(217,180,90,.14)}
.w.hl{background:var(--gd);color:#14100a;border-radius:4px;box-shadow:0 0 0 2px var(--gd)}
.acts{display:flex;gap:.1rem;margin-top:.25rem;opacity:.65}.m.user .acts{justify-content:flex-end}.m:hover .acts,.m.speaking .acts{opacity:1}.m.gen .acts{visibility:hidden}
.acts button,.ic{padding:.4rem;border-radius:8px;color:var(--mu);transition:background .25s,color .25s}.acts button:hover,.ic:hover{background:rgba(217,180,90,.16);color:var(--gd)}
.m.speaking [data-a=spk]{color:var(--gd)}
.err .body{border-color:#ff7b8a}
.ty i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--gd);animation:bn 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-6px);opacity:.4}}
.thumbs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}.thumbs img{height:84px;border-radius:10px;border:1px solid var(--ln)}
.tm{display:flex;align-items:center;gap:.8rem;margin-top:.5rem;padding:.6rem .9rem;border:1px solid var(--gd);border-radius:12px}.tm b{font:500 1.4rem 'Space Grotesk';letter-spacing:.08em;color:var(--gd)}.tm button{margin-left:auto;padding:.3rem .7rem;border:1px solid var(--ln);border-radius:8px}
.wel{margin:auto;text-align:center;max-width:560px;padding-top:8vh}.wel h1{font:300 clamp(1.8rem,5vw,2.8rem) 'Space Grotesk';letter-spacing:.3em;margin:.3rem 0;background:linear-gradient(110deg,#8a6a1f,#f6e3a1 50%,#8a6a1f);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.3em}
.sug{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.4rem}.sug button{padding:.6rem 1rem;border:1px solid var(--ln);border-radius:999px;background:var(--ab);transition:all .3s var(--e)}.sug button:hover{border-color:var(--gd);transform:translateY(-2px)}
#comp{padding:.6rem clamp(.6rem,3vw,1.5rem) calc(.6rem + env(safe-area-inset-bottom))}.cw{max-width:1000px;margin:0 auto}
#chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.4rem}.chip{display:flex;align-items:center;gap:.4rem;padding:.25rem .3rem .25rem .7rem;border:1px solid var(--ln);border-radius:999px;background:var(--ab);font-size:.8rem}.chip img{height:28px;border-radius:6px}
.box{display:flex;align-items:flex-end;gap:.2rem;padding:.4rem;border:1px solid var(--ln);border-radius:22px;background:var(--pn);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .3s,box-shadow .3s}
.box:focus-within{border-color:var(--gd);box-shadow:0 0 30px rgba(217,180,90,.18)}
